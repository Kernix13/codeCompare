<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Code In-Depth</title>
  <link rel="stylesheet" href="./css/prism.css">
  <link rel="stylesheet" href="./css/style.css">
</head>

<body>
  <header>
    <div class="wrapper header-flex">
      <div class="logo">codeCompare</div>
      <nav>
        <ul class="main-nav">
          <li class="nav-item"><a href="./index.html">Compare</a></li>
          <li class="nav-item"><a href="./details.html">In Depth</a></li>
          <li class="nav-item"><a href="./frameworks.html">Frameworks</a></li>
          <li class="nav-item" id="docs-nav"><a href="#">Docs ↓</a>
            <ul class="sub-nav">
              <li class="sub-nav-item"><a href="./docs/language.example.md">Example</a></li>
              <li class="sub-nav-item"><a href="./docs/csharp.md">CSharp</a></li>
              <li class="sub-nav-item"><a href="./docs/javascript.md">JavaScript</a></li>
              <li class="sub-nav-item"><a href="./docs/python.md">Python</a></li>
            </ul>
          </li>
        </ul>
      </nav>
    </div>
  </header>

  <main class="wrapper">
    <!-- FORM -->
    <form class="language-form" id="details-form">

      <fieldset class="form-group primary-radio-group">
        <legend>Primary Language</legend>

        <input type="radio" name="primaryLang" value="JavaScript" id="primary-js">
        <label for="primary-js" class="radio">JavaScript</label>

        <input type="radio" name="primaryLang" value="Python" id="primary-python">
        <label for="primary-python" class="radio">Python</label>

        <input type="radio" name="primaryLang" value="PHP" id="primary-php">
        <label for="primary-php" class="radio">PHP</label>

        <input type="radio" name="primaryLang" value="CSharp" id="primary-csharp">
        <label for="primary-csharp" class="radio">C#</label>
      </fieldset>

      <fieldset class="form-group secondary-radio-group">
        <legend>Compare with</legend>

        <input type="radio" name="secondaryLang" value="JavaScript" id="js">
        <label for="js" class="radio">JavaScript</label>

        <input type="radio" name="secondaryLang" value="Python" id="python">
        <label for="python" class="radio">Python</label>

        <input type="radio" name="secondaryLang" value="PHP" id="php">
        <label for="php" class="radio">PHP</label>

        <input type="radio" name="secondaryLang" value="CSharp" id="csharp">
        <label for="csharp" class="radio">C#</label>
      </fieldset>

      <fieldset class="form-group select">
        <label for="data-type" class="primary-lang">Data Type</label>
        <select id="data-type" name="data-type" required>
          <option value="">--- Select ---</option>
          <option value="number">Number</option>
          <option value="string">String</option>
          <option value="array">Array/List</option>
          <option value="object">Object/Dict</option>
          <option value="class">Class*</option>
        </select>
      </fieldset>

      <fieldset class="form-group select">
        <label for="methods" class="primary-lang">Function/Method</label>
        <select id="methods" name="methods"></select>
      </fieldset>

      <button type="submit" class="details-submit">Compare</button>
    </form>

    <h1 id="details-heading"></h1>

    <section id="compare-details"></section>

  </main>

  <footer>
    <div class="wrapper">
      <h2>codeCompare</h2>
      <!-- format this better later: -->
      <p><a href="https://github.com/Kernix13/codeCompare" target="_blank">GitHub repo</a></p>
      <p>&copy; 2026</p>
    </div>
  </footer>
  <script src="./js/global.js"></script>
  <script src="./js/data/detailsPreEls.js"></script>
  <script src="./js/details.js"></script>
  <script src="./js/prism.js"></script>
</body>

</html>
